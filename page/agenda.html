<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="../multimedia/Logo.png">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TaskFlow Pro</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Poppins', sans-serif;

      background:
      linear-gradient(
        135deg,
        #4facfe,
        #00f2fe
      );

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;

    }

    .container{

      width:100%;
      max-width:650px;

      background:white;

      border-radius:25px;

      padding:35px;

      box-shadow:
      0 10px 40px rgba(0,0,0,0.15);

    }

    h1{

      text-align:center;

      margin-bottom:10px;

      color:#222;

    }

    .subtitle{

      text-align:center;

      color:#666;

      margin-bottom:30px;

    }

    .task-input{

      display:flex;

      gap:10px;

      margin-bottom:25px;

    }

    .task-input input{

      flex:1;

      padding:15px;

      border:none;

      border-radius:14px;

      background:#f5f7fa;

      font-size:16px;

    }

    .task-input button{

      border:none;

      background:#4facfe;

      color:white;

      padding:15px 20px;

      border-radius:14px;

      cursor:pointer;

      font-weight:bold;

    }

    .stats{

      display:grid;

      grid-template-columns:repeat(3,1fr);

      gap:15px;

      margin-bottom:25px;

    }

    .card{

      background:#f7f9fc;

      padding:18px;

      border-radius:16px;

      text-align:center;

    }

    .card h2{

      color:#222;

      margin-bottom:5px;

    }

    .card p{

      color:#777;

      font-size:14px;

    }

    .task{

      background:#fff;

      border-radius:16px;

      padding:18px;

      margin-bottom:15px;

      display:flex;
      justify-content:space-between;
      align-items:center;

      border-left:6px solid orange;

      box-shadow:
      0 5px 15px rgba(0,0,0,0.05);

    }

    .task.completed{

      border-left:6px solid #00c853;

      opacity:0.8;

    }

    .task.completed h3{

      text-decoration:line-through;

      color:gray;

    }

    .status{

      font-size:14px;

      color:#666;

      margin-top:5px;

    }

    .buttons{

      display:flex;

      gap:10px;

    }

    .buttons button{

      border:none;

      padding:10px 14px;

      border-radius:10px;

      color:white;

      cursor:pointer;

      font-weight:600;

    }

    .complete-btn{

      background:#00c853;

    }

    .delete-btn{

      background:#ff5252;

    }

    .empty{

      text-align:center;

      margin-top:20px;

      color:#777;

    }

    .footer{

      margin-top:30px;

      text-align:center;

      color:#777;

      font-size:14px;

      border-top:1px solid #eee;

      padding-top:20px;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>📋 TaskFlow Pro</h1>

    <p class="subtitle">
      Organiza tus tareas fácilmente
    </p>

    <div class="task-input">

      <input
        type="text"
        id="taskInput"
        placeholder="Escribe una tarea..."
      >

      <button id="addTaskBtn">
        Agregar
      </button>

    </div>

    <div class="stats">

      <div class="card">
        <h2 id="totalTasks">0</h2>
        <p>Total</p>
      </div>

      <div class="card">
        <h2 id="completedTasks">0</h2>
        <p>Completadas</p>
      </div>

      <div class="card">
        <h2 id="pendingTasks">0</h2>
        <p>Pendientes</p>
      </div>

    </div>

    <div id="taskList"></div>

    <p
      class="empty"
      id="emptyMessage"
    >
       No hay tareas
    </p>

    <footer class="footer">
      Álvaro Caballero Rodríguez
    </footer>

  </div>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrl5nig0LAEzgOfr_lciGb_McLnJbPTqQ",

      projectId: "lista-de-tarea-4807a",
      storageBucket: "lista-de-tarea-4807a.firebasestorage.app",
      messagingSenderId: "475042270842",
      appId: "1:475042270842:web:49fd024a477c8b8a45b5c3",

    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    
    void analytics;
  </script>

  <script src="app.js"></script>

</body>

</html>
